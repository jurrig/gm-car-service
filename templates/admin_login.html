<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <title>Admin Login - GM Car Service</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <header>
        <h1>GM Car Service</h1>
    </header>

    <main id="app">
        <div class="login-card">
            <h2>Admin Login</h2>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST" action="{{ url_for('admin_login') }}" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label for="secret">Admin Password</label>
                <input type="password" id="secret" name="secret" required placeholder="Enter admin password"
                    autocomplete="current-password">
                <button type="submit">Sign In</button>
            </form>

            <a href="{{ url_for('index') }}" class="back-link">&larr; Back to Home</a>
        </div>
    </main>
</body>

</html>
